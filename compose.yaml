services:
  redis:
    container_name: redis
    image: redis:8.10.3-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - my-network
  redis-insight:
    image: redislabs/redisinsight:3.8.0
    container_name: redis-insight
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - my-network
networks:
  my-network:
    driver: bridge
